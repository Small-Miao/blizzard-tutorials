{% extends "base.html" %}

{%- block scripts %}
    <script>var base_url = '{{ base_url }}';</script>
    <script src="{{ 'js/theme_extra.js'|url }}" defer></script>
    <script src="{{ 'js/theme.js'|url }}" defer></script>
    {%- for path in extra_javascript %}
        <script src="{{ path }}" defer></script>
    {%- endfor %}
    <script defer>
        window.onload = function () {
            // nullify function that expands all menu sections
            window.SphinxRtdTheme.Navigation.reset = function() {};

            SphinxRtdTheme.Navigation.enable({{ 'true' if config.theme.sticky_navigation else 'false' }});

            // Let heading-only sections trigger the theme's native tree toggle.
            var $toggleLinks = $('.wy-menu li > a').filter(function() {
                var $link = $(this);
                var href = $link.attr('href');

                return $link.parent('li').children('ul').length > 0 && (!href || href === '#');
            });

            $toggleLinks.each(function() {
                $(this).attr({
                    href: '#',
                    role: 'button'
                });
            }).on('click', function(e) {
                var $link = $(this);
                var $toggle = $link.children('.toctree-expand');

                if (!$toggle.length) {
                    return;
                }

                e.preventDefault();
                $toggle.trigger('click');
            });
        };
    </script>
{%- endblock %}
